[package]
name = "poc-cadastro-transportadora-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "uuid", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
# `vendored` evita baixar o Swagger UI do GitHub durante o build (hermético/offline).
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
